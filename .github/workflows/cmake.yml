name: CMake

on:
  - push
  - pull_request

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Write sanitizer reports to files for the UBSan report step
  UBSAN_OPTIONS: log_path=${{github.workspace}}/build/ubsan

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
    - uses: actions/checkout@v2

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_C_COMPILER=${{matrix.cc}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target make_tests

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -E staging

    - name: Staging
      working-directory: ${{github.workspace}}/build
      # Regression test candidates: report failures without failing the build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure -R staging || echo "::warning::Staging tests failed"

    - name: UBSan report
      if: always()
      working-directory: ${{github.workspace}}/build
      # Undefined behavior found by the sanitizer, without failing the build.
      # Each site is listed with the number of test runs that reached it.
      run: |
        cat ubsan.* 2>/dev/null | grep -o '[^/ ]*: runtime error: .*' | awk '{n[$1]++; if (!($1 in m)) m[$1] = $0} END {for (k in n) print n[k], m[k]}' | sort -rn > ubsan-sites.txt || true
        cat ubsan-sites.txt
        if [ -s ubsan-sites.txt ]; then echo "::warning::UBSan: $(wc -l < ubsan-sites.txt) sites"; fi
      

